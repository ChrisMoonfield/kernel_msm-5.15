name: "Build kernels with WiFi Injection"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com"
      kernelBranch:
        description: "Kernel branch"
        required: false
        type: string
        default: "codelinaro"
      kernelDevice:
        description: "Device (used for defconfig, e.g., gki)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: ""
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "both"
        options:
          - "noksu"
          - "ksu"
          - "both"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 📐 Setup SWAP 15GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 15
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "📥 Initialize repo"
        working-directory: ${{ env.WORK_DIR}}
        run: |
         repo init -u https://googlesource.com -b common-android13-5.15-lts --depth=1
         repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
    
         rm -rf .repo
         rm -rf common

         # Clean up old Clang versions
         rm -rf prebuilts/clang/host/linux-x86/clang-3289846
         rm -rf prebuilts/clang/host/linux-x86/clang-stable
         
         sed -i \
          -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
          -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r450784e/' \
         ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants
    
         sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
         sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
         sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

         sed -i \
          -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
          -e '/^TRIM_NONLISTED_KMI=/d' \
          -e '/^KMI_ENFORCED=/d' \
          -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
          -e '$a\TRIM_NONLISTED_KMI=0' \
          -e '$a\KMI_ENFORCED=0' \
          -e '/^MODULES_ORDER=/d' \
          -e '/^MODULES_LIST=/d' \
         ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64

      - name: "📡 Inject QCACLD-3.0 Monitor Mode & Injection Patches"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "🌐 Скачивание патчей для монитор-мода Qualcomm..."
          curl -LSs "https://githubusercontent.com" -o qcacld_injection.patch
          
          echo "🔍 Поиск директории с драйвером qcacld-3.0..."
          WLAN_DIR=""
          for dir in drivers/staging/qcacld-3.0 drivers/net/wireless/qualcomm/qcacld-3.0 vendor/qcom/opensource/wlan/qcacld-3.0; do
            if [ -d "$dir" ]; then
              WLAN_DIR="$dir"
              break
            fi
          done

          if [ -n "$WLAN_DIR" ]; then
            echo "✅ Драйвер найден в: $WLAN_DIR"
            echo "🔧 Применение патча инъекции..."
            cd "$WLAN_DIR"
            if patch -p1 --forward < ../../../qcacld_injection.patch; then
              echo "🎉 Патч успешно наложен на QCACLD-3.0!"
            else
              echo "⚠️ Стандартный патч не встал автоматически. Пытаемся внести изменения в файлы вручную..."
              MAIN_C_FILE=$(find . -name "wlan_hdd_main.c")
              if [ -f "$MAIN_C_FILE" ]; then
                sed -i 's/wmi_vdev_param_drop_unencry.*/wmi_vdev_param_drop_unencry = 0;/g' "$MAIN_C_FILE"
                echo "✔ Принудительно отключен сброс незашифрованных пакетов в wlan_hdd_main.c"
              fi
            fi
            cd -
          else
            echo "❌ Ошибка: Не удалось найти директорию qcacld-3.0 в исходниках ядра."
            exit 1
          fi
          rm -f qcacld_injection.patch

      - name: "⚙️ Configure kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
          fi
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: "🔧 Setup ReSukiSU"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu

          echo "📦 Installing KSU..."
          curl -LSs "https://githubusercontent.com" | bash -s main
          
          echo "✔ KSU installed successfully"
          
          echo "📦 Cloning SUSFS4KSU for kernel patches..."
          git clone --depth=1 https://gitlab.com -b gki-android13-5.15

          echo "☣️ Applying namespace.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            NS_FAKE_PATCHED=1
          else
            echo "ℹ️ blk.h include not present in fs/namespace.c — skipping fake patch"
            NS_FAKE_PATCHED=0
          fi

          echo "☣️ Applying task_mmu.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            MM_FAKE_PATCHED=1
          else
            echo "ℹ️ mm.h include not present in fs/proc/task_mmu.c — skipping fake patch"
            MM_FAKE_PATCHED=0
          fi
          
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          echo "🔧 Applying SUSFS kernel patch..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed — copying files manually"
          fi

          echo "🔧 Applying SUSFS -> KernelSU patch..."
          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          
          echo "📄 Forcing SUSFS source injection..."
          
          mkdir -p fs
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          echo "✔ Copied fs/susfs.c"
          
          mkdir -p include/linux
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          echo "✔ Copied include/linux/susfs.h"
          
          if [ -f "$KSU_PATCH" ] && [ -d "KernelSU" ]; then
             cd KernelSU
             patch -p1 < "../$KSU_PATCH" || true
             cd ..
          fi

          if [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            echo "✔ Copied include/linux/susfs_def.h"
          fi
          
          rm -rf susfs4ksu
          
          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU=y
          EOF

      - name: "🏗️ Build Kernel via GKI Build Script"
        run: |
          # Запуск стандартного скрипта сборки GKI от Google
          BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki LTO=thin ./build/build.sh

      - name: "📦 Upload Compiled Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.variant }}-${{ env.BUILD_TIME }}
          path: |
            out/android13-5.15/dist/Image
            out/android13-5.15/dist/Image.gz
            out/android13-5.15/dist/*.ko
